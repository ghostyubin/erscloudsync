# BauduSync - docker-compose.yml
# Cloud sync for NAS (Baidu Netdisk & 115 Netdisk)
#
# Usage:
#   docker compose up -d --build
#
# Only the three volumes and TZ are actually settings. Every BAUDUSYNC_*
# variable has a default in app/config.py and most are also baked into the image
# as ENV, so listing them here with the same value adds nothing except a second
# place to forget when a default changes.

services:
  baudusync:
    image: ghcr.io/ghostyubin/erscloudsync:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baudusync
    restart: unless-stopped
    ports:
      - "5566:5566"
    volumes:
      # Defaults are directories next to this file (see .gitignore). On a NAS,
      # put the real absolute paths in a .env file rather than editing this one:
      #   BAUDUSYNC_CONFIG_DIR=/volume1/docker/baudusync
      #   BAUDUSYNC_SYNC_DIR=/volume1/sync
      #   BAUDUSYNC_DOWNLOAD_DIR=/volume1/downloads
      # Config directory (database, logs) - persistent, must survive rebuilds
      - ${BAUDUSYNC_CONFIG_DIR:-./config}:/config
      # Sync directory - mount your NAS storage here
      - ${BAUDUSYNC_SYNC_DIR:-./sync}:/sync
      # Downloads directory - for files downloaded from cloud
      - ${BAUDUSYNC_DOWNLOAD_DIR:-./downloads}:/downloads
    environment:
      # The image runs on UTC; without this every log line and every timestamp
      # in the UI is 8 hours off on a China-based NAS.
      - TZ=Asia/Shanghai
      # The rest already default to exactly these values. Uncomment to change:
      # - BAUDUSYNC_CONCURRENCY=3          # files synced in parallel
      # - BAUDUSYNC_UPLOAD_CONCURRENCY=4   # blocks of ONE file uploaded in parallel
      # - BAUDUSYNC_MAX_RETRIES=3          # attempts per operation (1 = no retry)
      # - BAUDUSYNC_RETRY_DELAY=3          # base backoff; attempt N waits N * this
      # - BAUDUSYNC_REALTIME_MAX_DELAY=30  # start a realtime cycle after N quiet-less seconds (0 = wait forever)
      # - BAUDUSYNC_WRITE_GRACE=3          # skip files modified within the last N seconds
    # json-file has no size limit by default, so the container log would grow
    # forever. The app keeps its own rotating file log under /config/log.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
