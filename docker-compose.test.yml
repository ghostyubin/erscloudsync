# BauduSync - docker-compose for remote machines
# Pulls pre-built multi-arch image from GitHub Container Registry
#
# Usage:
#   1. docker login ghcr.io -u ghostyubin --token YOUR_GITHUB_TOKEN
#   2. docker-compose -f docker-compose.test.yml up -d
#
# Update image: docker-compose -f docker-compose.test.yml pull && docker-compose -f docker-compose.test.yml up -d

version: "3.8"

services:
  baudusync:
    image: ghcr.io/ghostyubin/erscloudsync:latest
    container_name: baudusync
    restart: unless-stopped
    ports:
      - "5566:5566"
    volumes:
      # 配置目录（数据库、日志）- 持久化，必须挂载
      - ./config:/config
      # 同步目录 - 挂载你的存储路径
      - ./sync:/sync
      # 下载目录 - 从网盘下载的文件存放处
      - ./downloads:/downloads
    environment:
      - BAUDUSYNC_HOST=0.0.0.0
      - BAUDUSYNC_PORT=5566
      - BAUDUSYNC_DATA_DIR=/config
      - BAUDUSYNC_SYNC_ROOT=/sync
      - BAUDUSYNC_DOWNLOAD_DIR=/downloads
      - BAUDUSYNC_CONCURRENCY=3
