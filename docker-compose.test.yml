# BauduSync - docker-compose for remote machines
# Pulls the pre-built multi-arch image from GitHub Container Registry
#
# Usage:
#   1. docker login ghcr.io -u ghostyubin --token YOUR_GITHUB_TOKEN
#   2. docker compose -f docker-compose.test.yml up -d
#
# Update: docker compose -f docker-compose.test.yml pull && \
#         docker compose -f docker-compose.test.yml up -d

services:
  baudusync:
    image: ghcr.io/ghostyubin/erscloudsync:latest
    container_name: baudusync
    restart: unless-stopped
    ports:
      - "5566:5566"
    volumes:
      # 配置目录（数据库、日志）- 持久化，必须挂载
      - ./config:/config
      # 同步目录 - 挂载你的存储路径
      - ./sync:/sync
      # 下载目录 - 从网盘下载的文件存放处
      - ./downloads:/downloads
    environment:
      # 镜像跑在 UTC，不设这一行所有时间会差 8 小时
      - TZ=Asia/Shanghai
      # 其余参数都有默认值，需要时取消注释：
      # - BAUDUSYNC_CONCURRENCY=3
      # - BAUDUSYNC_UPLOAD_CONCURRENCY=4
      # - BAUDUSYNC_MAX_RETRIES=3
      # - BAUDUSYNC_RETRY_DELAY=3
      # - BAUDUSYNC_REALTIME_MAX_DELAY=30
      # - BAUDUSYNC_WRITE_GRACE=3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
